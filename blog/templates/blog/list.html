{% extends 'blog/base.html' %}

{% block content %}
  <h2>Wpisy</h2>
  {% for post in posts %}
    <article>
      <h3><a href="{{ post.get_absolute_url }}">{{ post.title }}</a></h3>
      <div class="meta">{{ post.published|date:"Y-m-d H:i" }} — {{ post.author }}</div>
      <p>{{ post.body|truncatechars:200 }}</p>
    </article>
  {% empty %}
    <p>Brak wpisów.</p>
  {% endfor %}
{% endblock %}
