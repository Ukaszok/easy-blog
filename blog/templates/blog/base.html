{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Easy Blog</title>
    <link rel="stylesheet" href="{% static 'blog/css/style.css' %}">
  </head>
  <body>
    <header>
      <div class="container">
        <h1><a href="/">Easy Blog</a></h1>
        <div class="user-info">
          {% if request.user.is_authenticated %}
            Zalogowany jako <strong>{{ request.user.username }}</strong>
            —
            <form method="post" action="{% url 'blog:logout' %}">
              {% csrf_token %}
              <button type="submit" class="logout-btn">Wyloguj</button>
            </form>
          {% else %}
            <a href="{% url 'blog:login' %}">Zaloguj</a>
            —
            <a href="{% url 'blog:register' %}">Rejestracja</a>
          {% endif %}
        </div>
      </div>
    </header>
    <div class="container">
      <main>
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
